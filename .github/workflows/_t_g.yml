name: "T-G full-inputs call modC"
on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: t-ksu_type
        required: false
        type: string
        default: 'resukisu'
      susfs_enable:
        description: t-susfs_enable
        required: false
        type: boolean
        default: true
      kpm_enable:
        description: t-kpm_enable
        required: false
        type: boolean
        default: true
      lz4_enable:
        description: t-lz4_enable
        required: false
        type: boolean
        default: true
      lz4kd_enable:
        description: t-lz4kd_enable
        required: false
        type: boolean
        default: true
      bbr_enable:
        description: t-bbr_enable
        required: false
        type: string
        default: 'false'
      better_net:
        description: t-better_net
        required: false
        type: boolean
        default: true
      ssg_enable:
        description: t-ssg_enable
        required: false
        type: boolean
        default: true
      rekernel_enable:
        description: t-rekernel_enable
        required: false
        type: boolean
        default: true
      baseband_guard:
        description: t-baseband_guard
        required: false
        type: boolean
        default: true
      ccache_update:
        description: t-ccache_update
        required: false
        type: boolean
        default: true
      ccache_debug:
        description: t-ccache_debug
        required: false
        type: boolean
        default: true
      kernel_suffix:
        description: t-kernel_suffix
        required: false
        type: string
        default: ''
jobs:
  v1:
    uses: ./.github/workflows/_t_mod_c.yml
    with:
        ksu_type: ${{ inputs.ksu_type }}
        susfs_enable: ${{ inputs.susfs_enable }}
        kpm_enable: ${{ inputs.kpm_enable }}
        lz4_enable: ${{ inputs.lz4_enable }}
        lz4kd_enable: ${{ inputs.lz4kd_enable }}
        bbr_enable: ${{ inputs.bbr_enable }}
        better_net: ${{ inputs.better_net }}
        ssg_enable: ${{ inputs.ssg_enable }}
        rekernel_enable: ${{ inputs.rekernel_enable }}
        baseband_guard: ${{ inputs.baseband_guard }}
        ccache_update: ${{ inputs.ccache_update }}
        ccache_debug: ${{ inputs.ccache_debug }}
        kernel_suffix: ${{ inputs.kernel_suffix }}
    secrets: inherit